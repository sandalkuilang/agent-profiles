name: Release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the whole matrix without publishing anything.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One artifact for both Apple chips. Two separate downloads would mostly
          # teach people to pick the wrong one; most users do not know their chip.
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check whether updater signing is configured
        id: updater_signing
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ] && [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build a plain release (no signing key configured yet)
        if: steps.updater_signing.outputs.configured == 'false'
        shell: bash
        # `createUpdaterArtifacts: true` in tauri.conf.json makes `tauri build`
        # refuse to finish at all without a private key — not skip the
        # updater artifacts, fail the whole build, every platform, taking the
        # ordinary unsigned .dmg/.msi/.AppImage down with it. Until the two
        # secrets below are set, turn it back off here so a release still
        # ships exactly as it did before automatic updates existed.
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts `createUpdaterArtifacts` produces and
          # writes `latest.json`, so the in-app updater can trust what it
          # downloads. This is a signing keypair made for the updater alone —
          # `tauri signer generate` — and has nothing to do with the OS
          # code-signing certificates this project cannot afford; it costs
          # nothing and verifies only that an update came from this repo's own
          # release, not from whoever controls the download. Unused (and
          # unnecessary) when the step above already turned artifact signing
          # off for this run.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agent Profiles ${{ github.ref_name }}
          # Every artifact here is unsigned, so say so where people download it
          # rather than letting the OS tell them the app is "damaged".
          releaseBody: |
            Unsigned builds. Your operating system will object, and its wording is misleading.

            - **macOS** may say the app "is damaged". It is not — it is unsigned. Right-click the app and choose **Open**.
            - **Windows** shows a SmartScreen warning. Choose **More info → Run anyway**.

            Only trust builds downloaded from this page.

            **Windows and Linux are unverified**: see the platform checklists in the README. Reports from those platforms are very welcome.

            Installed builds can also update themselves: turn on **Automatic updates** on the General tab and they will check this repository's releases and update silently, no download required.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
